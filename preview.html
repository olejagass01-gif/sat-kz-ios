<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SAT KZ — preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20242b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding:env(safe-area-inset-top) 18px 82px}.header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px}.logo{font-size:29px;font-weight:900;letter-spacing:-1.2px}.logo span{color:#f36b32}.sub{font-size:11px;color:#9299a3;margin-top:1px}.city{border:0;border-radius:12px;background:#f4f5f7;padding:10px;font-weight:700}.search{margin:8px 0 18px;background:#f4f5f7;border-radius:14px;padding:15px;display:flex;gap:10px}.search input{border:0;outline:0;background:transparent;font-size:14px;width:100%}.banner{background:#20242b;color:#fff;border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;min-height:150px}.eyebrow{font-size:9px;color:#f7a17d;font-weight:800;letter-spacing:1px}.banner h1{font-size:28px;line-height:1.08;margin:9px 0}.banner p{font-size:11px;color:#c8cbd0;margin:0}.bag{font-size:60px}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px}.section h2{font-size:18px;margin:0}.section button{border:0;background:none;color:#f36b32;font-weight:700}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}.cat{border:0;background:none;color:#555d68;font-size:10px;font-weight:600;text-align:center}.cat i{display:flex;margin:0 auto 7px;width:57px;height:57px;border-radius:17px;background:#f4f5f7;align-items:center;justify-content:center;font-style:normal;font-size:25px}.cat.active i{background:#f36b32;color:#fff}.cards{display:grid;gap:10px}.card{display:flex;gap:11px;border:1px solid #eef0f2;border-radius:15px;padding:10px;align-items:center}.photo{width:83px;height:83px;border-radius:12px;background:#f3f4f6;display:grid;place-items:center;font-size:35px;flex-shrink:0}.info{flex:1}.price{font-size:15px;font-weight:900}.title{font-size:12px;color:#4d5560;margin-top:5px}.meta{font-size:10px;color:#9aa1ac;margin-top:7px}.heart{font-size:20px;color:#68707c}.empty{text-align:center;color:#9299a3;padding:25px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:68px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #f0f1f3;display:flex;justify-content:space-around;align-items:center}.nav button{border:0;background:none;color:#9299a3;font-size:10px;display:grid;gap:3px;justify-items:center}.nav b{font-size:22px}.nav .sel{color:#f36b32}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(430px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 30px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheethead h2{margin:0;font-size:21px}.close{border:0;background:#f1f2f4;border-radius:50%;width:34px;height:34px;font-size:20px}.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#4d5560}.field input,.field textarea,.field select{width:100%;border:1px solid #e4e7eb;border-radius:12px;padding:13px;font:inherit;font-size:14px;background:#fff;outline-color:#f36b32}.field textarea{min-height:85px;resize:vertical}.publish{width:100%;border:0;border-radius:13px;background:#f36b32;color:white;padding:15px;font-weight:800;font-size:15px;margin-top:10px}.hint{font-size:11px;color:#9299a3;margin-top:6px}.photo-preview{font-size:12px;color:#68707c;margin-top:6px}
.profile-box{border:1px solid #eef0f2;border-radius:18px;padding:18px;margin:12px 0}.profile-box h2{margin:0 0 8px;font-size:21px}.profile-muted{color:#9299a3;font-size:12px;line-height:1.5}.profile-action{width:100%;border:0;border-radius:12px;background:#f36b32;color:#fff;padding:14px;font-weight:800;margin-top:10px}.profile-secondary{width:100%;border:1px solid #e4e7eb;border-radius:12px;background:#fff;padding:13px;font-weight:700;margin-top:9px}.profile-ad{padding:12px 0;border-bottom:1px solid #eef0f2;font-size:13px}.profile-ad b{display:block;margin-bottom:4px}.profile-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.profile-avatar{width:54px;height:54px;border-radius:50%;background:#fff0e9;display:grid;place-items:center;font-size:25px}
</style></head><body><main class="app"><header class="header"><div><div class="logo">SAT<span> KZ</span></div><div class="sub">Покупай. Продавай. Просто.</div></div><button class="city">📍 Астана⌄</button></header>
<div class="search">⌕ <input id="q" placeholder="Что хотите найти?"></div>
<section class="banner"><div><div class="eyebrow">ДОБРО ПОЖАЛОВАТЬ В SAT KZ</div><h1>Найди то,<br>что ищешь</h1><p>Объявления со всего Казахстана</p></div><div class="bag">🛍️</div></section>
<div class="section"><h2>Категории</h2><button id="all">Все объявления</button></div>
<div class="cats" id="cats"></div>
<div class="section"><h2>Свежие объявления</h2><small id="count" style="color:#9aa1ac">4 найдено</small></div><div class="cards" id="cards"></div></main>

<div class="modal" id="addModal"><section class="sheet"><div class="sheethead"><h2>Новое объявление</h2><button class="close" id="closeModal" type="button">×</button></div>
<form id="adForm">
<label class="field"><span>Название объявления *</span><input id="adTitle" required maxlength="80" placeholder="Например, iPhone 14 Pro"></label>
<label class="field"><span>Цена в тенге *</span><input id="adPrice" type="number" min="1" required placeholder="Например, 280000"></label>
<label class="field"><span>Категория *</span><select id="adCategory" required><option value="">Выберите категорию</option><option>Недвижимость</option><option>Транспорт</option><option>Электроника</option><option>Работа</option><option>Для дома</option><option>Услуги</option><option>Одежда</option><option>Животные</option></select></label>
<label class="field"><span>Город *</span><input id="adCity" required placeholder="Например, Астана"></label>
<label class="field"><span>Описание</span><textarea id="adDescription" placeholder="Расскажите подробнее о товаре"></textarea></label>
<label class="field"><span>Фотография</span><input id="adPhoto" type="file" accept="image/*"><div class="photo-preview" id="photoName"></div></label>
<div class="hint">Это демонстрация: объявление добавится только на этой странице.</div><button class="publish" type="submit">Опубликовать объявление</button>
</form></section></div>

<nav class="nav"><button class="sel"><b>⌂</b>Главная</button><button><b>♡</b>Избранное</button><button><b style="color:#f36b32">⊕</b>Добавить</button><button><b>▤</b>Сообщения</button><button><b>♙</b>Профиль</button></nav>
<script>
const categories=[['Недвижимость','⌂'],['Транспорт','🚗'],['Электроника','▣'],['Работа','▤'],['Для дома','🛋'],['Услуги','🔧'],['Одежда','♧'],['Животные','🐾']];
const defaultAds=[['📱','280 000 ₸','iPhone 14 Pro, 256 GB','Астана','Электроника'],['🏠','25 000 000 ₸','Уютная 2-комнатная квартира','Алматы','Недвижимость'],['🚘','10 500 000 ₸','Toyota Camry 2018','Караганда','Транспорт'],['💻','350 000 ₸','Игровой ноутбук ASUS','Астана','Электроника']];
let ads;try{const saved=localStorage.getItem('satkz_ads');ads=saved?JSON.parse(saved):defaultAds.slice()}catch(e){ads=defaultAds.slice()}
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('satkz_favs')||'[]')}catch(e){favorites=[]}
let profile=null;try{profile=JSON.parse(localStorage.getItem('satkz_profile')||'null')}catch(e){profile=null}
let active='Все', page='home';
const cats=document.getElementById('cats'),cards=document.getElementById('cards'),q=document.getElementById('q');
const count=document.getElementById('count'),modal=document.getElementById('addModal');
function saveAds(){try{localStorage.setItem('satkz_ads',JSON.stringify(ads))}catch(e){}}
function saveFavs(){try{localStorage.setItem('satkz_favs',JSON.stringify(favorites))}catch(e){}}
function renderCats(){cats.innerHTML=categories.map(([n,i])=>'<button class="cat '+(active===n?'active':'')+'" data-cat="'+n+'"><i>'+i+'</i>'+n+'</button>').join('');cats.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=active===b.dataset.cat?'Все':b.dataset.cat;page='home';render()})}
function renderAds(){let list=ads.map((a,i)=>({a,i})).filter(({a,i})=>(page!=='favorites'||favorites.includes(i))&&(active==='Все'||a[4]===active)&&(a[2]+' '+a[3]).toLowerCase().includes(q.value.toLowerCase()));count.textContent=list.length+' найдено';cards.innerHTML=list.length?list.map(({a,i})=>'<article class="card"><div class="photo">'+a[0]+'</div><div class="info"><div class="price">'+a[1]+'</div><div class="title">'+a[2]+'</div><div class="meta">📍 '+a[3]+' · Сегодня</div></div><button class="heart" data-fav="'+i+'" style="border:0;background:none">'+(favorites.includes(i)?'♥':'♡')+'</button></article>').join(''):'<div class="empty">'+(page==='favorites'?'Пока нет избранных объявлений. Нажмите ♡ рядом с понравившимся товаром.':'Ничего не найдено. Попробуйте другой запрос.')+'</div>';cards.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.fav);favorites=favorites.includes(i)?favorites.filter(x=>x!==i):[...favorites,i];saveFavs();renderAds()})}
function showInfo(title,desc){cats.innerHTML='';cards.innerHTML='<div class="empty" style="padding:40px 12px"><div style="font-size:42px;margin-bottom:12px">💬</div><b style="font-size:18px;color:#20242b">'+title+'</b><p>'+desc+'</p></div>';count.textContent=''}
function renderProfile(){
 cats.innerHTML='';count.textContent='';
 if(!profile){
  cards.innerHTML='<section class="profile-box"><h2>Вход или регистрация</h2><p class="profile-muted">Укажите имя и номер телефона, чтобы создать демонстрационный профиль SAT KZ.</p><label class="field"><span>Ваше имя</span><input id="profileName" maxlength="40" placeholder="Например, Олег"></label><label class="field"><span>Номер телефона Казахстана</span><input id="profilePhone" type="tel" inputmode="tel" placeholder="+7 777 123 45 67"></label><p class="profile-muted">Пока без SMS-кода. Настоящую проверку номера подключим после настройки сервера.</p><button class="profile-action" id="profileSave">Продолжить</button></section>';
  document.getElementById('profileSave').onclick=()=>{const name=document.getElementById('profileName').value.trim();let phone=document.getElementById('profilePhone').value.replace(/\D/g,'');if(phone.length===10)phone='7'+phone;if(phone.length!==11||phone[0]!=='7'){alert('Введите номер Казахстана: +7 и 10 цифр.');return}if(!name){alert('Введите ваше имя.');return}profile={name,phone:'+'+phone};try{localStorage.setItem('satkz_profile',JSON.stringify(profile))}catch(e){}renderProfile()};
 }else{
  const mine=ads.filter(a=>a[5]===profile.phone);
  cards.innerHTML='<section class="profile-box"><div class="profile-top"><div class="profile-avatar">👤</div><div><h2 id="profileGreeting"></h2><div class="profile-muted" id="profilePhoneText"></div></div></div><p class="profile-muted">Ваш профиль сохранён на этом устройстве.</p><button class="profile-secondary" id="myAdsButton">Мои объявления ('+mine.length+')</button><button class="profile-secondary" id="logoutButton">Выйти из профиля</button></section><section class="profile-box" id="myAdsBox"><h2>Мои объявления</h2><div id="myAdsList"></div></section>';
  document.getElementById('profileGreeting').textContent=profile.name;
  document.getElementById('profilePhoneText').textContent=profile.phone;
  const list=document.getElementById('myAdsList');list.innerHTML=mine.length?mine.map(a=>'<div class="profile-ad"><b>'+a[2]+'</b>'+a[1]+' · '+a[3]+'</div>').join(''):'<p class="profile-muted">Вы ещё не публиковали объявления с этого профиля.</p>';
  document.getElementById('myAdsButton').onclick=()=>document.getElementById('myAdsBox').scrollIntoView({behavior:'smooth',block:'start'});
  document.getElementById('logoutButton').onclick=()=>{if(confirm('Выйти из профиля?')){profile=null;try{localStorage.removeItem('satkz_profile')}catch(e){}renderProfile()}};
 }
}
function render(){document.querySelector('.banner').style.display=page==='home'?'flex':'none';document.querySelector('.search').style.display=(page==='home'||page==='favorites')?'flex':'none';document.querySelectorAll('.section').forEach(el=>el.style.display=page==='home'||page==='favorites'?'flex':'none');if(page==='messages')showInfo('Сообщения','Здесь будут ваши переписки с продавцами. Чат появится после подключения сервера.');else if(page==='profile')renderProfile();else{renderCats();renderAds()}document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('sel',['home','favorites','add','messages','profile'][i]===page))}
q.addEventListener('input',renderAds);
document.getElementById('all').onclick=()=>{active='Все';page='home';q.value='';render()};
document.querySelectorAll('.nav button').forEach((b,i)=>b.onclick=()=>{const p=['home','favorites','add','messages','profile'][i];if(p==='add'){modal.classList.add('open');return}page=p;if(p==='home'){active='Все';q.value=''}render()});
document.querySelector('.city').onclick=()=>alert('Выбор города появится в следующем обновлении.');
document.getElementById('closeModal').onclick=()=>modal.classList.remove('open');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.getElementById('adPhoto').addEventListener('change',e=>{document.getElementById('photoName').textContent=e.target.files[0]?.name||''});
document.getElementById('adForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('adTitle').value.trim(),price=Number(document.getElementById('adPrice').value),category=document.getElementById('adCategory').value,city=document.getElementById('adCity').value.trim();if(!title||!price||!category||!city)return;const emoji={'Недвижимость':'🏠','Транспорт':'🚗','Электроника':'📱','Работа':'💼','Для дома':'🛋️','Услуги':'🔧','Одежда':'👕','Животные':'🐾'};ads.unshift([emoji[category]||'📦',price.toLocaleString('ru-RU')+' ₸',title,city,category,profile?profile.phone:'']);favorites=favorites.map(i=>i+1);saveAds();saveFavs();active='Все';page='home';q.value='';render();modal.classList.remove('open');e.target.reset();document.getElementById('photoName').textContent='';alert('Объявление добавлено в демо-просмотр.')});
render();
</script></body></html>
